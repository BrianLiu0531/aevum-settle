# QDay testnet stack. Fill in .env first (see .env.example), then:
#   docker compose up -d              settler + Postgres      http://localhost:8080
#   docker compose --profile demo up  + the demo merchant     http://localhost:8787
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: settler
    ports:
      - "5441:5432"
    volumes:
      - ./settler/docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 15

  settler:
    build: ./settler
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/settler?sslmode=disable
      HTTP_ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  merchant:
    profiles: ["demo"]
    build: ./demo
    env_file: .env
    environment:
      SETTLER_URL: http://settler:8080
      MERCHANT_PORT: "8787"
    ports:
      - "8787:8787"
    depends_on:
      - settler
    restart: unless-stopped

volumes:
  pgdata:
